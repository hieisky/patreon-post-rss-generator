name: Manual Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      deploy_notes:
        description: 'Notes for this deployment'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.23.4'
        cache: 'yarn'

    - name: Display deploy information
      env:
        DEPLOY_NOTES: ${{ github.event.inputs.deploy_notes }}
      run: |
        echo "🚀 Starting production deployment"
        printf '📝 Deploy notes: %s\n' "$DEPLOY_NOTES"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Create deployment package
      run: yarn run zip

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to Lambda
      env:
        LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
      run: |
        script/aws_lambda_func_update.sh "$LAMBDA_FUNCTION_NAME"

    - name: Deployment Summary
      run: |
        echo "✅ Deployed successfully to production"
        echo "🕒 Deployment time: $(date)"
        echo "👤 Triggered by: ${{ github.actor }}"
